services:
  - type: web
    name: mavpark-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && node src/seed.js
    startCommand: node src/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mavpark-db
          property: connectionString

databases:
  - name: mavpark-db
    plan: free
    region: ohio
