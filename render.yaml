services:
  - type: web
    name: mavpark-backend
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && node src/seed.js && node src/index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mavpark-db
          property: connectionString

databases:
  - name: mavpark-db
    plan: free
    region: oregon
